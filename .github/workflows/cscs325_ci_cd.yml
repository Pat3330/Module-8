name: CSC325 Pipeline

on:
  push:
    branches:
      - main

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.11"

  dependencies: 
    name: Dependencies
    needs: setup
    runs-on: ubuntu-latest

    steps: 
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: "3.11"

      - name: Install Packages
        run: pip install -r requirements.txt


  test: 
    name: Test
    needs: dependencies
    runs-on: ubuntu-latest

    steps: 
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run Tests
        run: python manage.py test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
     - name: Deploy
       run: echo "Success"

    
